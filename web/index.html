<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#0e7a6d" />
  <meta name="description" content="حقوق‌یار — محاسبه حقوق و دستمزد و ارسال فیش به ربات بله" />
  <title>حقوق‌یار | محاسبه حقوق و دستمزد</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">ح</div>
        <div class="brand-text">
          <strong>حقوق‌یار</strong>
          <span id="orgName">محاسبه حقوق و دستمزد</span>
        </div>
      </div>
      <button class="period-chip" id="periodChip" type="button" aria-label="انتخاب دوره">
        <span class="dot"></span>
        <span id="periodLabel">—</span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" role="tablist">
      <button type="button" class="nav-btn is-active" data-tab="payroll" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z M8 9h8 M8 13h5 M8 17h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>فیش‌ها</span>
      </button>
      <button type="button" class="nav-btn" data-tab="employees" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>پرسنل</span>
      </button>
      <button type="button" class="nav-btn" data-tab="send" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l6.5 2.5L12 21l9-17Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 13.5 21 4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>ارسال بله</span>
      </button>
      <button type="button" class="nav-btn" data-tab="settings" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>تنظیمات</span>
      </button>
    </nav>
  </div>

  <!-- ورود -->
  <div class="overlay hidden" id="loginOverlay">
    <form class="login-card" id="loginForm">
      <div class="login-icon">🔒</div>
      <h2>ورود به حقوق‌یار</h2>
      <p class="muted">رمز عبور پنل را وارد کنید.</p>
      <label class="field">
        <span>رمز عبور</span>
        <input type="password" id="loginPassword" autocomplete="current-password" required />
      </label>
      <p class="error" id="loginError"></p>
      <button class="btn btn-primary btn-block" type="submit">ورود</button>
    </form>
  </div>

  <!-- شیت -->
  <div class="sheet-wrap hidden" id="sheetWrap" role="dialog" aria-modal="true">
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet" id="sheet" tabindex="-1"></div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <div class="loading-bar hidden" id="loadingBar"></div>

  <script src="app.js"></script>
</body>
</html>
